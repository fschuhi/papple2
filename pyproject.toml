[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papple2"
version = "0.1.0"
description = "A small Apple II emulator, used as a debugging instrument"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "manual: opens a pygame window; excluded from the default `pytest` run, run explicitly with `-m manual`",
]
addopts = "-m 'not manual'"
