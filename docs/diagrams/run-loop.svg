<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>One pass of Emulator.run() (papple2 at pre-redesign)</title>
<desc>Checkpoints, CPU step, post_op, window polling every 1000 passes, stop check; checkpoints and window feed the pysm state machine.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="560" fill="#FFFFFF"/>
<rect x="40" y="40" width="340" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="210.0" y="63" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Checkpoints, in list order</text>
<text x="210.0" y="82" text-anchor="middle" font-size="12" fill="#993C1D">stand-ins, keys, watch, until</text>
<line x1="210" y1="98" x2="210" y2="132" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="136" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="210.0" y="159" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">cpu.do_next_step()</text>
<text x="210.0" y="178" text-anchor="middle" font-size="12" fill="#5F5E5A">reads and writes: see memory view</text>
<line x1="210" y1="194" x2="210" y2="228" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="232" width="340" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="210.0" y="255" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Emulator.post_op()</text>
<text x="210.0" y="274" text-anchor="middle" font-size="12" fill="#534AB7">MemoryMap, jsr_stack, collector</text>
<line x1="210" y1="290" x2="210" y2="324" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="328" width="340" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="210.0" y="351" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Window, every 1000 passes</text>
<text x="210.0" y="370" text-anchor="middle" font-size="12" fill="#534AB7">poll input, then redraw</text>
<line x1="210" y1="386" x2="210" y2="420" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="424" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="210.0" y="447" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Stop check</text>
<text x="210.0" y="466" text-anchor="middle" font-size="12" fill="#5F5E5A">until given, no longer running</text>
<rect x="420" y="40" width="220" height="344" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="530" y="185" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">State machine (pysm)</text>
<text x="530" y="214" text-anchor="middle" font-size="12" font-weight="400" fill="#534AB7">Running</text>
<text x="530" y="236" text-anchor="middle" font-size="12" font-weight="400" fill="#534AB7">Stopped</text>
<text x="530" y="258" text-anchor="middle" font-size="12" font-weight="400" fill="#534AB7">halt</text>
<line x1="382" y1="68" x2="416" y2="68" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="382" y1="356" x2="416" y2="356" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="210" y="510" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A">then the next pass of the while loop</text>
<rect x="40" y="528" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="60" y="538" text-anchor="start" font-size="12" font-weight="400" fill="#5F5E5A">plugged in from outside</text>
<rect x="249" y="528" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="269" y="538" text-anchor="start" font-size="12" font-weight="400" fill="#5F5E5A">built into Emulator</text>
<rect x="430" y="528" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="450" y="538" text-anchor="start" font-size="12" font-weight="400" fill="#5F5E5A">machine and loop</text>
</svg>
