<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Memory access paths (papple2 at pre-redesign)</title>
<desc>Write path: CPU.write_byte, write_hook which may veto, Memory, devices. Read path: CPU.read_byte, Memory, then read_hook. Two groups of accesses no hook sees.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="410" fill="#FFFFFF"/>
<rect x="20" y="30" width="640" height="110" rx="12" fill="none" stroke="#B4B2A9" stroke-dasharray="4 4" stroke-width="0.75"/>
<text x="40" y="55" text-anchor="start" font-size="14" font-weight="500" fill="#444441">Write path</text>
<rect x="20" y="160" width="640" height="110" rx="12" fill="none" stroke="#B4B2A9" stroke-dasharray="4 4" stroke-width="0.75"/>
<text x="40" y="185" text-anchor="start" font-size="14" font-weight="500" fill="#444441">Read path</text>
<rect x="40" y="68" width="132" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="106.0" y="91" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">CPU.write_byte</text>
<text x="106.0" y="110" text-anchor="middle" font-size="12" fill="#5F5E5A">writes, pushes</text>
<line x1="174" y1="96" x2="190" y2="96" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="192" y="68" width="132" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="258.0" y="91" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">write_hook</text>
<text x="258.0" y="110" text-anchor="middle" font-size="12" fill="#534AB7">may veto</text>
<line x1="326" y1="96" x2="342" y2="96" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="344" y="68" width="132" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="410.0" y="91" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Memory</text>
<text x="410.0" y="110" text-anchor="middle" font-size="12" fill="#5F5E5A">sets _mem</text>
<line x1="478" y1="96" x2="494" y2="96" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="496" y="68" width="132" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="562.0" y="91" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Devices</text>
<text x="562.0" y="110" text-anchor="middle" font-size="12" fill="#5F5E5A">switches, screen</text>
<rect x="40" y="198" width="132" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="106.0" y="221" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">CPU.read_byte</text>
<text x="106.0" y="240" text-anchor="middle" font-size="12" fill="#5F5E5A">data and stack</text>
<line x1="174" y1="226" x2="190" y2="226" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="192" y="198" width="132" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="258.0" y="221" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Memory</text>
<text x="258.0" y="240" text-anchor="middle" font-size="12" fill="#5F5E5A">$C0xx: switches</text>
<line x1="326" y1="226" x2="342" y2="226" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="344" y="198" width="132" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="410.0" y="221" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">read_hook</text>
<text x="410.0" y="240" text-anchor="middle" font-size="12" fill="#534AB7">told afterwards</text>
<rect x="40" y="300" width="290" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="185.0" y="323" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Unhooked, inside the CPU</text>
<text x="185.0" y="342" text-anchor="middle" font-size="12" fill="#993C1D">opcode, operand, immediate, offset</text>
<rect x="350" y="300" width="290" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="495.0" y="323" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Unhooked, outside the CPU</text>
<text x="495.0" y="342" text-anchor="middle" font-size="12" fill="#993C1D">stand-ins, image loads, key presses</text>
<rect x="40" y="378" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="60" y="388" text-anchor="start" font-size="12" font-weight="400" fill="#5F5E5A">hook slots</text>
<rect x="158" y="378" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text x="178" y="388" text-anchor="start" font-size="12" font-weight="400" fill="#5F5E5A">accesses no hook sees</text>
</svg>
